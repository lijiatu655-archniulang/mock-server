server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: xinyuan-village
  datasource:
    url: jdbc:mysql://localhost:3306/xinyuan_village?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:xinyuan-village-server-secret-key-please-change-32}
    expire-hours: 168
    mock-login: true
  storage:
    base-dir: ./data/upload
    url-prefix: /static/upload
  ai:
    # 总开关：false 时走本地规则引擎（断网可演示）；true 且配置 key 后走大模型 + RAG
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}   # openai（兼容）｜echo（本地假模型，仅联调）
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen-plus}
    temperature: 0.3
    max-tokens: 800
    timeout-ms: 60000
    rag:
      top-k: 3
      min-score: 0.2
      history-rounds: 3
  wechat:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}

logging:
  level:
    com.xinyuan.village: info
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
